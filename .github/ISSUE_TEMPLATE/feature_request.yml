name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 docs/ 下的文档，没有找到相同建议
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述实际业务场景与痛点，越具体越好
      placeholder: 例如：门店退货时无法按批次指定退回仓库……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望系统怎么做（界面在哪、流程如何、和现有模块怎么衔接）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现状下你是怎么绕过的
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响一个页面 / 模块
        - 涉及后端接口与数据库
        - 涉及权限模型
        - 涉及部署方式
        - 不确定
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 原型草图、参考系统、合规要求等
    validations:
      required: false
