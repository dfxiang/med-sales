services:
  medsales-api:
    build: ./api
    image: medsales-api:latest
    container_name: medsales-api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:pass01!@demo-db:5432/medsalesdb
      JWT_SECRET: ${JWT_SECRET:-medsales-change-me-to-a-long-random-secret-please}
      SYS_API_KEYS: ${SYS_API_KEYS:-}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # 本系统专用对象存储（MinIO / S3），用于 GSP 证照扫描件等文件归档
      S3_ENDPOINT_URL: http://medsales-minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-medsales}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-medsales-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-medsales}
      S3_REGION: ${S3_REGION:-us-east-1}
      # GSP 交易准入校验（默认开启：已建档的主体证照过期/待审核/驳回时禁止交易）
      GSP_ENFORCE_QUALIFICATION: ${GSP_ENFORCE_QUALIFICATION:-true}
      GSP_STRICT_QUALIFICATION: ${GSP_STRICT_QUALIFICATION:-false}
      GSP_EXPIRY_WARNING_DAYS: ${GSP_EXPIRY_WARNING_DAYS:-90}
    networks:
      - kb
    depends_on:
      - medsales-minio
    restart: unless-stopped

  medsales-web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    image: medsales-web:latest
    container_name: medsales-web
    ports:
      - "8088:80"
    depends_on:
      - medsales-api
    networks:
      - kb
    restart: unless-stopped

  # 本系统专用对象存储（S3 兼容），独立于 kb / biz-oa / datahive 的 MinIO
  medsales-minio:
    image: minio/minio:latest
    container_name: medsales-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medsales}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medsales-minio-secret}
    ports:
      - "9020:9000"   # S3 API
      - "9021:9001"   # Web 控制台
    volumes:
      - medsales-minio-data:/data
    networks:
      - kb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 一次性初始化：确保专用 bucket 存在
  medsales-minio-init:
    image: minio/minio:latest
    container_name: medsales-minio-init
    depends_on:
      medsales-minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://medsales-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medsales}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medsales-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-medsales}
    networks:
      - kb
    restart: "no"

networks:
  kb:
    external: true

volumes:
  medsales-minio-data:
