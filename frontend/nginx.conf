server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 附件上传体积上限。必须大于后端 ATTACHMENT_MAX_BYTES（20MB）：
    # nginx 默认仅 1MB，会让证照扫描件（手机拍摄通常 2~5MB）在网关层被 413 拦截，
    # 根本到不了 API。这里放宽到 25MB，真正超限时交由后端返回统一的中文 JSON 错误。
    client_max_body_size 25m;

    # API 同源反代到后端容器
    location /api/ {
        proxy_pass http://medsales-api:8000;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
